name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
      - run: uv run --frozen ruff check
      - run: uv run --frozen ruff format --check

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Spark needs a JVM. Pin it to match the Docker image.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
      - run: uv run --frozen pytest

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag dorado-airflow .
