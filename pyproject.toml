[project]
name = "dorado"
version = "0.1.0"
description = "Batch pipeline that computes DORA metrics from GitHub Archive data."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyspark>=4.2.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import order
    "UP",  # modern Python syntax
    "B",   # likely bugs
    "SIM", # simplifications
    "ANN", # type hints
    "D",   # docstrings
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D104"]
